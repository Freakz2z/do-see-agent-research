[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dosee-agent-research-public"
version = "0.1.0"
description = "Sanitized reproducible harness for fault-conditioned authorization research in tool-using agents"
requires-python = ">=3.11"
dependencies = ["cryptography>=43,<50"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
